<a class="voltar" id="voltar"><i class="bi bi-arrow-left"></i> <span id="nome-evento"></span></a>

<header class="cabecalho-pagina">
  <div>
    <h1>O que eu posso levar?</h1>
    <p class="subtitulo">Itens que ainda faltam: obrigatórios primeiro, depois os menos cobertos.</p>
  </div>
</header>

<section class="card escolha-pessoa mb-4">
  <div class="card-body">
    <label class="form-label" for="quem"><i class="bi bi-person-circle"></i> Quem é você?</label>
    <select class="form-select" id="quem">
      <option value="">Escolha seu nome...</option>
    </select>
  </div>
</section>

<p class="nota-ocultos" id="ocultos" hidden>
  <i class="bi bi-eye-slash"></i><span data-campo="ocultos"></span>
</p>

<div class="row g-3" id="sugestoes"></div>

<div class="vazio" id="sem-sugestoes">
  <i class="bi bi-person-check"></i>
  <p data-campo="vazio"></p>
</div>

<template data-modelo="sugestao">
  <div class="col-md-6 col-xl-4">
    <article class="card sugestao h-100">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start gap-2">
          <span class="sugestao-categoria" data-campo="categoria"></span>
          <span class="chip chip-obrigatorio" data-campo="obrigatorio">obrigatório</span>
        </div>
        <h2 class="sugestao-nome" data-campo="item"></h2>
        <p class="sugestao-faltante">Faltam <strong data-campo="faltante"></strong></p>
        <div data-barra></div>
        <p class="sugestao-sua" data-campo="sua"></p>
        <div class="conflito" data-campo="conflito">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <div>
            <strong class="d-block" data-campo="conflito-voce">Conflita com a sua restrição.</strong>
            <span data-campo="conflito-texto"></span>
          </div>
        </div>
      </div>
      <form class="card-footer levar" novalidate>
        <div class="input-group input-group-sm has-validation">
          <input class="form-control" name="quantidade" type="number" min="1" step="1" aria-label="Quantidade">
          <span class="input-group-text" data-campo="unidade"></span>
          <button class="btn btn-primary" type="submit"><i class="bi bi-basket"></i> Vou levar</button>
          <div class="invalid-feedback" data-erro="quantidade"></div>
        </div>
      </form>
    </article>
  </div>
</template>
