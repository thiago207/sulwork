<a class="voltar" id="voltar"><i class="bi bi-arrow-left"></i> Voltar</a>

<header class="cabecalho-pagina">
  <div>
    <h1 id="titulo"></h1>
    <p class="subtitulo">O prazo para alterações precisa ser antes da data do evento.</p>
  </div>
</header>

<form id="form-evento" class="card formulario-evento" novalidate>
  <div class="card-body p-4">
    <div class="row g-3">
      <div class="col-md-8">
        <label class="form-label" for="nome">Nome</label>
        <input class="form-control" id="nome" name="nome" maxlength="120" placeholder="Ex.: Café de fim de ano" required>
        <div class="invalid-feedback" data-erro="nome"></div>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="tipo">Tipo</label>
        <select class="form-select" id="tipo" name="tipo" required>
          <option value="">Escolha...</option>
        </select>
        <div class="invalid-feedback" data-erro="tipo"></div>
      </div>
      <div class="col-12">
        <label class="form-label" for="descricao">Descrição <span class="text-secondary fw-normal">(opcional)</span></label>
        <textarea class="form-control" id="descricao" name="descricao" maxlength="1000" rows="3"></textarea>
        <div class="invalid-feedback" data-erro="descricao"></div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="dataHora"><i class="bi bi-calendar-event"></i> Data e hora do evento (Recife)</label>
        <input class="form-control" type="datetime-local" id="dataHora" name="dataHora" required>
        <div class="invalid-feedback" data-erro="dataHora"></div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="prazoAlteracoes"><i class="bi bi-hourglass-split"></i> Prazo para alterações (Recife)</label>
        <input class="form-control" type="datetime-local" id="prazoAlteracoes" name="prazoAlteracoes" required>
        <div class="invalid-feedback" data-erro="prazoAlteracoes"></div>
      </div>
    </div>
  </div>
  <div class="card-footer d-flex justify-content-end gap-2 p-3">
    <a class="btn btn-light" id="cancelar">Cancelar</a>
    <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Salvar evento</button>
  </div>
</form>
