<header class="cabecalho-pagina agenda-cabecalho">
  <div>
    <h1>Agenda de eventos</h1>
    <p class="subtitulo">Datas e horários de Recife.</p>
  </div>
  <a class="btn btn-primary text-nowrap" href="#/eventos/novo"><i class="bi bi-plus-lg" aria-hidden="true"></i> Novo evento</a>
</header>

<section class="agenda" aria-label="Eventos cadastrados">
  <div class="agenda-filtros">
    <label for="filtro-status">Status</label>
    <select class="form-select filtro-status" id="filtro-status">
      <option value="">Todos os status</option>
    </select>
  </div>
  <div class="agenda-colunas" id="colunas-eventos" aria-hidden="true">
    <span>Data</span><span>Evento</span><span>Tipo</span><span>Status</span>
  </div>
  <ul id="lista-eventos"></ul>
  <p class="agenda-vazia" id="sem-eventos" hidden>Nenhum evento encontrado.</p>
</section>

<template data-modelo="evento">
  <li>
    <a class="evento-linha">
      <time class="evento-data">
        <span class="evento-dia" data-campo="dia"></span>
        <span class="evento-mes" data-campo="mes"></span>
        <span class="evento-ano" data-campo="ano"></span>
      </time>
      <div class="evento-nome">
        <h2 data-campo="nome"></h2>
        <span data-campo="quando"></span>
      </div>
      <span class="evento-tipo">
        <i class="bi" data-icone-tipo aria-hidden="true"></i>
        <span data-campo="tipo"></span>
      </span>
      <span class="badge-status" data-campo="status"></span>
      <i class="bi bi-chevron-right evento-seta" aria-hidden="true"></i>
    </a>
  </li>
</template>
