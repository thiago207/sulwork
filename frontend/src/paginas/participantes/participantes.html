<header class="cabecalho-pagina">
  <div>
    <h1>Participantes</h1>
    <p class="subtitulo">Pessoas da equipe e as restrições alimentares de cada uma.</p>
  </div>
</header>

<div class="row g-4">
  <div class="col-lg-5">
    <form id="form-participante" class="card" novalidate>
      <div class="card-body p-4">
        <h2 class="titulo-card"><i class="bi bi-person-plus" id="icone-form"></i> <span id="titulo-form">Novo participante</span></h2>
        <div class="mb-3">
          <label class="form-label" for="participante-nome">Nome</label>
          <input class="form-control" id="participante-nome" name="nome" maxlength="120" required>
          <div class="invalid-feedback" data-erro="nome"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="participante-cpf">CPF</label>
          <input class="form-control" id="participante-cpf" name="cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="14" autocomplete="off">
          <div class="form-text" id="ajuda-cpf" hidden>Deixe em branco para manter o CPF atual.</div>
          <div class="invalid-feedback" data-erro="cpf"></div>
        </div>
        <fieldset class="mb-3">
          <legend class="form-label">Restrições alimentares</legend>
          <div class="opcoes-chip" id="opcoes-restricoes"></div>
        </fieldset>
        <div class="mb-4">
          <label class="form-label" for="participante-observacao">Observação <span class="text-secondary fw-normal">(opcional)</span></label>
          <input class="form-control" id="participante-observacao" name="observacaoRestricao" maxlength="500" placeholder="Ex.: alergia leve a castanhas">
          <div class="invalid-feedback" data-erro="observacaoRestricao"></div>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-light" type="button" id="cancelar-edicao" hidden>Cancelar</button>
          <button class="btn btn-primary flex-grow-1" type="submit"><i class="bi bi-check-lg"></i> <span id="botao-form">Cadastrar</span></button>
        </div>
      </div>
    </form>
  </div>

  <div class="col-lg-7">
    <section class="card">
      <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2 py-3">
        <span class="fw-semibold">Cadastrados <span class="contador ms-1" id="total"></span></span>
        <div class="busca">
          <i class="bi bi-search"></i>
          <input class="form-control form-control-sm" type="search" id="busca" placeholder="Buscar pelo nome" aria-label="Buscar pelo nome">
        </div>
      </div>
      <ul class="list-group list-group-flush" id="lista-participantes"></ul>
      <p class="text-secondary text-center m-0 p-4" id="sem-participantes" hidden></p>
    </section>
  </div>
</div>
