spring.application.name=backend

# Banco de dados: le variaveis de ambiente, com valores padrao para rodar local
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sulwork}
spring.datasource.username=${DB_USUARIO:sulwork}
spring.datasource.password=${DB_SENHA:sulwork}

# JPA: o esquema e criado pelo Flyway; o Hibernate so confere se as entidades batem com as tabelas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Recife
# evita N+1 ao carregar colecoes lazy (ex.: restricoes de varios participantes numa consulta so)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Flyway: aplica as migrations de classpath:db/migration ao subir
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Jackson: 2.5 num campo inteiro vira erro 400 em vez de ser cortado para 2
spring.jackson.deserialization.accept-float-as-int=false

# Actuator: expoe apenas health e info
management.endpoints.web.exposure.include=health,info

# CORS: origens do front que podem chamar a API (Vite em dev e Nginx no Docker)
app.cors.origens=${CORS_ORIGENS:http://localhost:5173,http://localhost:3000}

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Nao copia as respostas do @RestControllerAdvice para todos os endpoints; cada um documenta as suas
springdoc.override-with-generic-response=false
