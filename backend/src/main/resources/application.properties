spring.application.name=backend

# Banco de dados: le variaveis de ambiente, com valores padrao para rodar local
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sulwork}
spring.datasource.username=${DB_USUARIO:sulwork}
spring.datasource.password=${DB_SENHA:sulwork}

# JPA: o esquema e criado pelo Flyway; o Hibernate so confere se as entidades batem com as tabelas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Recife

# Flyway: aplica as migrations de classpath:db/migration ao subir
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator: expoe apenas health e info
management.endpoints.web.exposure.include=health,info

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
