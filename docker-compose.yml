services:
  banco:
    image: postgres:18-alpine
    container_name: sulwork-banco
    environment:
      POSTGRES_DB: ${DB_NOME:-sulwork}
      POSTGRES_USER: ${DB_USUARIO:-sulwork}
      POSTGRES_PASSWORD: ${DB_SENHA:-sulwork}
      TZ: America/Recife
    ports:
      - "5432:5432"
    volumes:
      - dados_banco:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: sulwork-backend
    environment:
      DB_URL: jdbc:postgresql://banco:5432/${DB_NOME:-sulwork}
      DB_USUARIO: ${DB_USUARIO:-sulwork}
      DB_SENHA: ${DB_SENHA:-sulwork}
      CORS_ORIGENS: ${CORS_ORIGENS:-http://localhost:3000}
      TZ: America/Recife
    ports:
      - "8080:8080"
    depends_on:
      banco:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: sulwork-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  dados_banco:
